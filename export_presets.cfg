html/head_include="<meta name='theme-color' content='#0b0806'>
<meta name='description' content='Knightfall Enlightened: an open-world, first-person medieval survival game you can play in your browser.'>
<style>
body, #status { background-color: #0b0806 !important; }
#status-splash { display: none !important; }
#kf-title { font: 700 clamp(46px, 8vw, 100px)/1 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif; color: #e6c47a; text-align: center; margin: 0 16px 8px; text-shadow: 0 4px 22px rgba(0,0,0,0.85); }
#kf-sub { font: 500 clamp(13px, 1.8vw, 19px)/1 Georgia, serif; letter-spacing: 0.55em; color: #d8cbb0; text-align: center; margin: 0 16px 34px; }
#kf-hint { font: 400 15px/1.6 Georgia, serif; color: #b9a988; text-align: center; margin: 24px auto 0; max-width: 640px; padding: 0 16px; }
#status-progress { width: min(380px, 72vw); accent-color: #e6c47a; }
#kf-rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #0b0806; color: #e6c47a; font: 600 22px/1.5 Georgia, serif; text-align: center; align-items: center; justify-content: center; padding: 24px; }
@media (orientation: portrait) and (pointer: coarse) { #kf-rotate { display: flex; } }
</style>
<meta name='apple-mobile-web-app-capable' content='yes'>
<meta name='mobile-web-app-capable' content='yes'>
<meta name='apple-mobile-web-app-status-bar-style' content='black'>
<link rel='manifest' href='manifest.json'>
<script>
var kfTouch = window.matchMedia && matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches;
(function () {
	// An open world is heavy for WebGL 2: draw at the page's own pixel size rather than the
	// screen's (a Retina or 4K display would otherwise mean four times the pixels to shade).
	// Phones get up to twice that, for sharp text; the game draws its 3D at a lower scale there.
	var ratio = kfTouch ? Math.min(window.devicePixelRatio || 1, 2) : 1;
	var d = Object.getOwnPropertyDescriptor(window, 'devicePixelRatio') || Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window), 'devicePixelRatio');
	if (!d || !d.configurable && Object.getOwnPropertyDescriptor(window, 'devicePixelRatio')) return;
	Object.defineProperty(window, 'devicePixelRatio', { configurable: true, enumerable: true, get: function () { return ratio; } });
})();
// Phones and tablets can't use the desktop's compressed textures (S3TC): they get the build made
// for them (KF_MOBILE_PACK, ETC2 textures), set by tools/web/finalize.py.
function kfHasS3TC() {
	if (location.search.indexOf('etc2') >= 0) {
		return false;          // (testing: the phones' build on a desktop)
	}
	try {
		var gl = document.createElement('canvas').getContext('webgl2');
		if (!gl) {
			return true;
		}
		var ok = !!gl.getExtension('WEBGL_compressed_texture_s3tc');
		var lose = gl.getExtension('WEBGL_lose_context');
		if (lose) {
			lose.loseContext();
		}
		return ok;
	} catch (e) {
		return true;
	}
}
if (kfTouch) {
	// on the first touch: fill the screen and hold it sideways (where the browser allows it)
	document.addEventListener('touchend', function () {
		var el = document.documentElement;
		if (el.requestFullscreen && !document.fullscreenElement) {
			el.requestFullscreen({ navigationUI: 'hide' }).then(function () {
				if (screen.orientation && screen.orientation.lock) {
					screen.orientation.lock('landscape').catch(function () {});
				}
			}).catch(function () {});
		}
	}, { once: true });
}
// The game's files are kept in the browser's storage by a service worker (tools/web/sw.js).
// Start the engine once the newest worker is in charge, so this visit's downloads are kept too.
function kfServiceWorker() {
	if (!('serviceWorker' in navigator) || location.protocol !== 'https:' && location.hostname !== 'localhost') {
		return Promise.resolve();
	}
	return new Promise(function (resolve) {
		var done = false;
		function finish() {
			if (!done) {
				done = true;
				resolve();
			}
		}
		setTimeout(finish, 4000);
		navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
			return reg.update().catch(function () {}).then(function () {
				if (navigator.serviceWorker.controller && !reg.installing && !reg.waiting) {
					finish();
				} else {
					navigator.serviceWorker.addEventListener('controllerchange', finish);
				}
			});
		}).catch(finish);
	});
}
function kfWrapEngine(engine) {
	var start = engine.startGame;
	engine.startGame = function (override) {
		var me = this;
		return kfServiceWorker().then(function () {
			if (window.KF_MOBILE_PACK && !kfHasS3TC()) {
				override = Object.assign({}, override || {}, { mainPack: window.KF_MOBILE_PACK });
			}
			return start.call(me, override);
		});
	};
	return engine;
}
document.addEventListener('DOMContentLoaded', function () {
	document.title = 'Knightfall Enlightened';
	var s = document.getElementById('status');
	if (!s) return;
	var t = document.createElement('div');
	t.id = 'kf-title';
	t.textContent = 'Knightfall';
	var u = document.createElement('div');
	u.id = 'kf-sub';
	u.textContent = 'ENLIGHTENED';
	s.insertBefore(u, s.firstChild);
	s.insertBefore(t, s.firstChild);
	var h = document.createElement('div');
	h.id = 'kf-hint';
	h.textContent = kfTouch ? 'An open-world medieval survival game. The first visit downloads about KF_MSIZE MB (Wi-Fi recommended); after that it starts straight from your browser’s storage. Hold your device sideways.' : 'An open-world medieval survival game. The first visit downloads about KF_SIZE MB; after that it starts straight from your browser’s storage. Best in Chrome or Edge on a computer with a mouse and keyboard.';
	s.appendChild(h);
	var r = document.createElement('div');
	r.id = 'kf-rotate';
	r.textContent = 'Turn your device sideways to play Knightfall.';
	document.body.appendChild(r);
});
</script>"
